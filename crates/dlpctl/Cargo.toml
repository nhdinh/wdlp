[package]
name = "dlpctl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dlp-agent-core = { path = "../dlp-agent-core" }
dlp-crypto = { path = "../dlp-crypto" }
dlp-domain = { path = "../dlp-domain" }
dlp-protocol = { path = "../dlp-protocol" }
dlp-server = { path = "../dlp-server" }
dlp-storage = { path = "../dlp-storage" }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "http2", "json"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "sqlite", "tls-rustls-ring"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "tracing-log"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[dev-dependencies]
rcgen = { version = "=0.14.8", features = ["pem", "x509-parser"] }

[[test]]
name = "walking_skeleton"
path = "../../tests/e2e/walking_skeleton.rs"
