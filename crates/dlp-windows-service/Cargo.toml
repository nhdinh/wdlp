[package]
name = "dlp-windows-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# This crate is the documented containment boundary for Windows FFI. Portable
# crates retain the workspace-wide `forbid(unsafe_code)` policy.
unsafe_code = "allow"

[dependencies]
dlp-agent-core = { path = "../dlp-agent-core" }
dlp-crypto = { path = "../dlp-crypto" }
dlp-domain = { path = "../dlp-domain" }
dlp-storage = { path = "../dlp-storage" }
rand = "=0.8.5"
rustls = { version = "=0.23.43", features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }
windows-service = "=0.8.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_RemoteDesktop", "Win32_System_Pipes"] }
zeroize = "=1.9.0"
