[package]
name = "dlp-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "=0.8.9"
dlp-domain = { path = "../dlp-domain" }
dlp-protocol = { path = "../dlp-protocol" }
sqlx = { version = "=0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread"] }
