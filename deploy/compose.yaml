services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    env_file:
      - ../config/server.env.example
    environment:
      POSTGRES_DB: dlp
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrations:
    build:
      context: ..
    command: ["dlp-server", "--migrate-only"]
    env_file:
      - ../config/server.env.example
    environment:
      DATABASE_URL:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${DLP_PKI_DIR:-./pki}
        target: /run/dlp-pki
        read_only: true
    restart: "no"

  server:
    build:
      context: ..
    command: ["dlp-server"]
    env_file:
      - ../config/server.env.example
    environment:
      DATABASE_URL:
      DLP_SERVER_CERT_PEM: /run/dlp-pki/server.cert.pem
      DLP_SERVER_KEY_PEM: /run/dlp-pki/server.key.pem
      DLP_ADMIN_CA_CERT_PEM: /run/dlp-pki/admin-ca.cert.pem
      DLP_PHASE1_ROOT_CA_CERT_PEM: /run/dlp-pki/phase1-root.cert.pem
      DLP_DEVICE_ISSUING_CA_CERT_PEM: /run/dlp-pki/device-issuer.cert.pem
      DLP_DEVICE_ISSUING_CA_KEY_PEM: /run/dlp-pki/device-issuer.key.pem
      DLP_CONFIGURATION_SIGNING_KEY_SEED_HEX:
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${DLP_PKI_DIR:-./pki}
        target: /run/dlp-pki
        read_only: true
    ports:
      - "127.0.0.1:8443:8080"

volumes:
  postgres-data:
