[package]
name = "dlp-log-debug-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# This development-only package contains the documented Windows SCM macro
# boundary. Portable library code keeps `#![forbid(unsafe_code)]`.
unsafe_code = "allow"

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_urlencoded = "=0.7.1"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
