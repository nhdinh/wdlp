[package]
name = "dlp-windows-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# This crate is the documented containment boundary for Windows FFI. Portable
# crates retain the workspace-wide `forbid(unsafe_code)` policy.
unsafe_code = "allow"

[dependencies]
dlp-agent-core = { path = "../dlp-agent-core" }
sha2 = "=0.11.0"
windows-service = "=0.8.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading"] }
zeroize = "=1.9.0"
