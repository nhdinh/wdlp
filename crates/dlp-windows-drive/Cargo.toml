[package]
name = "dlp-windows-drive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# This crate contains the WinFsp host binary with unavoidable Windows FFI.
unsafe_code = "allow"

[dependencies]
dlp-domain = { path = "../dlp-domain" }
dlp-policy = { path = "../dlp-policy", version = "=0.1.0" }
dlp-storage = { path = "../dlp-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0"
sha2 = "=0.11.0"
winfsp = "0.13.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Pipes"] }
zeroize = "=1.9.0"

[build-dependencies]
winfsp = "0.13.0"

[dev-dependencies]
dlp-domain = { path = "../dlp-domain" }
tempfile = "=3.27.0"
