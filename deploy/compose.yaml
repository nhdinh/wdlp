# Reference Docker Compose deployment.
# The Phase 1 lab now uses NATIVE PostgreSQL on LAB-SERVER01 (Ubuntu, 192.168.50.12)
# instead of a containerized database. This file is kept as a reference for
# container-based deployments and is not exercised by the lab orchestration scripts.
#
# For the lab, set DATABASE_URL in the runtime provider to point to LAB-SERVER01:
#   postgres://dlp_server:<password>@192.168.50.12:5432/dlp
#
# The migrations service is intentionally omitted because sqlx-cli is run directly
# from the orchestration host (hungdinh-lt) against the native PostgreSQL instance.

services:
  server:
    build:
      context: ..
    command: ["dlp-server"]
    env_file:
      - ../config/server.env.example
    environment:
      DATABASE_URL:
      DLP_SERVER_CERT_PEM: /run/dlp-pki/server.cert.pem
      DLP_SERVER_KEY_PEM: /run/dlp-pki/server.key.pem
      DLP_ADMIN_CA_CERT_PEM: /run/dlp-pki/admin-ca.cert.pem
      DLP_PHASE1_ROOT_CA_CERT_PEM: /run/dlp-pki/phase1-root.cert.pem
      DLP_DEVICE_ISSUING_CA_CERT_PEM: /run/dlp-pki/device-issuer.cert.pem
      DLP_DEVICE_ISSUING_CA_KEY_PEM: /run/dlp-pki/device-issuer.key.pem
      DLP_CONFIGURATION_SIGNING_KEY_SEED_HEX:
    volumes:
      - type: bind
        source: ${DLP_PKI_DIR:-./pki}
        target: /run/dlp-pki
        read_only: true
    ports:
      - "127.0.0.1:8443:8080"
